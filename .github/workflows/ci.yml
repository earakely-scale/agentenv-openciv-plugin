name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

defaults:
  run:
    shell: bash  # -eo pipefail

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install 'ruff>=0.16,<0.17'
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    env:
      CIVBRIDGE_CMD: ${{ github.workspace }}/build/bridge/CivBridge
    steps:
      # vendor/OpenCiv3 only: its nested art submodule is not needed (and is SSH-only).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - run: scripts/build-bridge.sh
      - run: pip install -e '.[dev]'
      # tests/ (bridge, env, packaging) and the playtest harness's offline tests.
      - run: pytest
      - run: agent-env plugin check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install .
      # The README's quickstart: build and register the image, then a scripted game, graded and recorded.
      - run: agent-env openciv3 setup
      - run: |
          agent-env run openciv3 --task smoke | tee smoke.log
          grep -qE 'tasks/smoke\.json v[0-9]+: passed' smoke.log
      - name: The recording was saved, as an mp4 and an HTML replay
        run: |
          agent-env openciv3 recordings --out recording
          ls recording/*.mp4 recording/*.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-recording
          path: recording/
